# Entorno local: API (.NET 8 en contenedor) + PostgreSQL.
# Uso: POSTGRES_PASSWORD=<clave> ADMIN_PASSWORD=<clave> docker compose up --build
# Frontend: cd frontend && npm install && API_PROXY_TARGET=http://localhost:8080 npm run dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: musicstream
      POSTGRES_USER: musicstream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicstream"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Default: Host=db;Database=musicstream;Username=musicstream;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      Seed__AdminEmail: admin@musicstream.pe
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "8080:8080"
