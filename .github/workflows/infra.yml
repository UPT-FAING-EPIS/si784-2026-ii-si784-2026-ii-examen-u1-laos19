name: infra

# Aprovisiona la infraestructura en Azure con Terraform.
# Secretos requeridos: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# (service principal con rol Owner sobre la suscripción) y APP_ADMIN_PASSWORD.
# Variables requeridas: AZURE_SUFFIX (ej. laos19). Opcional: AZURE_LOCATION.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción de Terraform"
        type: choice
        options: [plan, apply, destroy]
        default: apply
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

env:
  TF_DIR: infra/terraform
  TF_IN_AUTOMATION: "true"
  SUFFIX: ${{ vars.AZURE_SUFFIX }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}

jobs:
  terraform:
    name: Terraform ${{ inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validar configuración
        run: |
          if [ -z "$SUFFIX" ]; then
            echo "::error::Defina la variable de repositorio AZURE_SUFFIX (3-12 caracteres en minúsculas/números)."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Bootstrap del backend remoto (Storage Account para el estado)
        run: |
          rg="rg-tfstate-${SUFFIX}"
          sa="tfstate${SUFFIX}"
          az group create --name "$rg" --location "$LOCATION" --output none
          if ! az storage account show --name "$sa" --resource-group "$rg" --output none 2>/dev/null; then
            az storage account create --name "$sa" --resource-group "$rg" --location "$LOCATION" \
              --sku Standard_LRS --kind StorageV2 --min-tls-version TLS1_2 \
              --allow-blob-public-access false --https-only true --output none
          fi
          # La CLI obtiene la clave de la cuenta con las credenciales del service principal.
          az storage container create --name tfstate --account-name "$sa" --auth-mode key --output none
          {
            echo "TFSTATE_RG=$rg"
            echo "TFSTATE_SA=$sa"
          } >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${TFSTATE_RG}" \
            -backend-config="storage_account_name=${TFSTATE_SA}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=musicstream.tfstate"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_suffix: ${{ vars.AZURE_SUFFIX }}
          TF_VAR_location: ${{ vars.AZURE_LOCATION || 'eastus2' }}
          TF_VAR_admin_password: ${{ secrets.APP_ADMIN_PASSWORD }}
          ACTION: ${{ inputs.action || 'apply' }}
        run: |
          if [ "$ACTION" = "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Terraform apply
        if: ${{ (inputs.action || 'apply') != 'plan' }}
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publicar salidas
        if: ${{ (inputs.action || 'apply') == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          {
            echo "## Infraestructura aprovisionada"
            echo ""
            echo "| Recurso | Valor |"
            echo "|---|---|"
            terraform output -json | jq -r 'to_entries[] | "| \(.key) | \(.value.value) |"'
          } >> "$GITHUB_STEP_SUMMARY"
