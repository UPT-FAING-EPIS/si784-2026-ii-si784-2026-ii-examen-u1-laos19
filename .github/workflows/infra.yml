name: infra

# Aprovisiona la infraestructura en Azure con Terraform.
# Autenticación sin secretos (OIDC): ejecutar una vez infra/bootstrap/setup-github-oidc.sh
# en Azure Cloud Shell y registrar como *Variables* del repositorio:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Opcionales: AZURE_SUFFIX (por defecto laos19) y AZURE_LOCATION (por defecto eastus2).
# Las contraseñas (PostgreSQL, JWT y administrador) las genera Terraform.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Acción de Terraform"
        type: choice
        options: [plan, apply, destroy]
        default: apply
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra
  cancel-in-progress: false

env:
  TF_DIR: infra/terraform
  TF_IN_AUTOMATION: "true"
  SUFFIX: ${{ vars.AZURE_SUFFIX || 'laos19' }}
  LOCATION: ${{ vars.AZURE_LOCATION || 'eastus2' }}
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_suffix: ${{ vars.AZURE_SUFFIX || 'laos19' }}
  TF_VAR_location: ${{ vars.AZURE_LOCATION || 'eastus2' }}

jobs:
  terraform:
    name: Terraform ${{ inputs.action || 'apply' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # En push se omite hasta que Azure esté configurado; manualmente muestra el error de configuración.
    if: vars.AZURE_CLIENT_ID != '' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validar configuración
        run: |
          if [ -z "$ARM_CLIENT_ID" ] || [ -z "$ARM_TENANT_ID" ] || [ -z "$ARM_SUBSCRIPTION_ID" ]; then
            echo "::error::Faltan las variables AZURE_CLIENT_ID, AZURE_TENANT_ID y AZURE_SUBSCRIPTION_ID. Ejecute infra/bootstrap/setup-github-oidc.sh en Azure Cloud Shell (ver README)."
            exit 1
          fi

      - name: Azure login (OIDC, sin secretos)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bootstrap del backend remoto (Storage Account para el estado)
        run: |
          rg="rg-tfstate-${SUFFIX}"
          sa="tfstate${SUFFIX}"
          az group create --name "$rg" --location "$LOCATION" --output none
          if ! az storage account show --name "$sa" --resource-group "$rg" --output none 2>/dev/null; then
            az storage account create --name "$sa" --resource-group "$rg" --location "$LOCATION" \
              --sku Standard_LRS --kind StorageV2 --min-tls-version TLS1_2 \
              --allow-blob-public-access false --https-only true --output none
          fi
          # La CLI obtiene la clave de la cuenta con la identidad federada.
          az storage container create --name tfstate --account-name "$sa" --auth-mode key --output none
          {
            echo "TFSTATE_RG=$rg"
            echo "TFSTATE_SA=$sa"
          } >> "$GITHUB_ENV"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${TFSTATE_RG}" \
            -backend-config="storage_account_name=${TFSTATE_SA}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=musicstream.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        env:
          ACTION: ${{ inputs.action || 'apply' }}
        run: |
          if [ "$ACTION" = "destroy" ]; then
            terraform plan -destroy -input=false -out=tfplan
          else
            terraform plan -input=false -out=tfplan
          fi

      - name: Terraform apply
        if: ${{ (inputs.action || 'apply') != 'plan' }}
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Publicar salidas
        if: ${{ (inputs.action || 'apply') == 'apply' }}
        working-directory: ${{ env.TF_DIR }}
        run: |
          {
            echo "## Infraestructura aprovisionada"
            echo ""
            echo "| Recurso | Valor |"
            echo "|---|---|"
            terraform output -json | jq -r 'to_entries[] | select(.value.sensitive | not) | "| \(.key) | \(.value.value) |"'
            echo ""
            echo "La contraseña del administrador inicial está en el App Service (Configuración → Seed__AdminPassword)."
          } >> "$GITHUB_STEP_SUMMARY"
