name: sonar

# Análisis estático con SonarQube (C#, JavaScript/React, Terraform y Docker).
#
# Sin configuración: levanta un SonarQube Community efímero dentro del runner, genera sus
# propias credenciales, analiza el código y publica el reporte (HTML/JSON/Markdown) como
# artefacto "sonarqube-report" y en el resumen de la ejecución. No necesita tokens.
#
# Opcional: si existe el secreto SONAR_TOKEN (y las variables SONAR_ORGANIZATION y
# SONAR_PROJECT_KEY), el análisis se envía a SonarCloud para tener un dashboard permanente.
#
# Política: el job falla si hay bugs, vulnerabilidades o security hotspots sin revisar.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SONARCLOUD_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Iniciar SonarQube efímero (sin tokens)
        if: env.SONARCLOUD_TOKEN == ''
        run: |
          sudo sysctl -w vm.max_map_count=262144
          .github/scripts/sonarqube-start.sh

      - name: Usar SonarCloud
        if: env.SONARCLOUD_TOKEN != ''
        run: echo "SONAR_HOST_URL=https://sonarcloud.io" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Pruebas y análisis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN || env.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'musicstream' }}
          SONAR_ORGANIZATION: ${{ env.SONARCLOUD_TOKEN != '' && vars.SONAR_ORGANIZATION || '' }}
        run: .github/scripts/sonarqube-analyze.sh

      - name: Reporte y política (0 bugs, 0 vulnerabilidades, 0 hotspots)
        if: always() && env.SONARCLOUD_TOKEN == '' && env.SONAR_ADMIN_PASSWORD != ''
        env:
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY || 'musicstream' }}
        run: python3 .github/scripts/sonar_report.py sonarqube-report

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && env.SONARCLOUD_TOKEN == ''
        with:
          name: sonarqube-report
          path: sonarqube-report/
          if-no-files-found: ignore
