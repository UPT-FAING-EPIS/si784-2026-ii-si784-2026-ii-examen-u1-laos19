name: sonar

# Análisis estático con SonarCloud (C# + JavaScript/React + Terraform + Docker).
# Secretos: SONAR_TOKEN. Variables: SONAR_ORGANIZATION, SONAR_PROJECT_KEY.
# El Quality Gate debe pasar sin bugs, vulnerabilidades ni security hotspots.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache de SonarCloud
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      - name: Instalar SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Frontend - pruebas con cobertura
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage

      - name: Análisis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.projectBaseDir="$GITHUB_WORKSPACE" \
            /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml" \
            /d:sonar.javascript.lcov.reportPaths="frontend/coverage/lcov.info" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/node_modules/**,frontend/dist/**,frontend/coverage/**,docs/**,src/**,index.html,vite.config.js,tailwind.config.js,postcss.config.js,.github/**" \
            /d:sonar.coverage.exclusions="backend/src/MusicStream.Api/Program.cs,backend/src/MusicStream.Api/Dtos/**,backend/tools/**,frontend/src/pages/**,frontend/src/components/**,frontend/src/main.jsx,frontend/src/App.jsx,frontend/vite.config.js,**/*.test.js" \
            /d:sonar.cpd.exclusions="backend/tests/**" \
            /d:sonar.qualitygate.wait=true
          dotnet build backend/MusicStream.sln --configuration Release
          dotnet test backend/MusicStream.sln --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
          dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
