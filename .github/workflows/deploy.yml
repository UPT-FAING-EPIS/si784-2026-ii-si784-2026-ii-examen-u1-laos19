name: deploy

# Construye y despliega la aplicación en Azure:
#  - Backend: imagen de contenedor -> Azure Container Registry -> App Service (Linux)
#  - Frontend: build de Vite -> Azure Static Web Apps
# Requiere haber ejecutado infra.yml.
# Secretos: AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID. Variables: AZURE_SUFFIX.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SUFFIX: ${{ vars.AZURE_SUFFIX }}
  IMAGE_NAME: musicstream-api

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend - pruebas unitarias e integración
        run: dotnet test backend/MusicStream.sln --configuration Release
      - name: Frontend - pruebas
        working-directory: frontend
        run: |
          npm ci
          npm test

  backend:
    name: Desplegar backend (contenedor)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.app.outputs.api_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Nombres de recursos
        id: names
        run: |
          echo "rg=rg-musicstream-${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "acr=musicstream${SUFFIX}acr" >> "$GITHUB_OUTPUT"
          echo "app=app-musicstream-${SUFFIX}-api" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Build y push de la imagen a ACR
        env:
          ACR: ${{ steps.names.outputs.acr }}
          SHA: ${{ github.sha }}
        run: |
          az acr login --name "$ACR"
          image="$ACR.azurecr.io/$IMAGE_NAME"
          docker build -t "$image:$SHA" -t "$image:latest" backend
          docker push "$image:$SHA"
          docker push "$image:latest"

      - name: Actualizar App Service
        id: app
        env:
          RG: ${{ steps.names.outputs.rg }}
          ACR: ${{ steps.names.outputs.acr }}
          APP: ${{ steps.names.outputs.app }}
          SHA: ${{ github.sha }}
        run: |
          az webapp config container set --name "$APP" --resource-group "$RG" \
            --container-image-name "$ACR.azurecr.io/$IMAGE_NAME:$SHA" \
            --container-registry-url "https://$ACR.azurecr.io" --output none
          az webapp restart --name "$APP" --resource-group "$RG"
          host=$(az webapp show --name "$APP" --resource-group "$RG" --query defaultHostName -o tsv)
          echo "api_url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Smoke test /health
        env:
          API_URL: ${{ steps.app.outputs.api_url }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/health"; then echo; echo "API saludable"; exit 0; fi
            echo "Esperando a la API ($i/30)..."; sleep 20
          done
          echo "::error::La API no respondió en /health"; exit 1

  frontend:
    name: Desplegar frontend (Static Web Apps)
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ needs.backend.outputs.api_url }}
        run: |
          npm ci
          npm run build

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy a Static Web Apps
        id: swa
        run: |
          rg="rg-musicstream-${SUFFIX}"
          name="swa-musicstream-${SUFFIX}"
          # El token se usa sólo dentro de este paso y nunca se imprime.
          SWA_CLI_DEPLOYMENT_TOKEN=$(az staticwebapp secrets list --name "$name" --resource-group "$rg" --query "properties.apiKey" -o tsv)
          export SWA_CLI_DEPLOYMENT_TOKEN
          npx --yes @azure/static-web-apps-cli@2 deploy frontend/dist --env production
          host=$(az staticwebapp show --name "$name" --resource-group "$rg" --query defaultHostname -o tsv)
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Resumen
        env:
          WEB_URL: ${{ steps.swa.outputs.url }}
          API_URL: ${{ needs.backend.outputs.api_url }}
        run: |
          {
            echo "## Aplicación desplegada"
            echo ""
            echo "- Frontend: $WEB_URL"
            echo "- API: $API_URL"
            echo "- Swagger: $API_URL/swagger"
          } >> "$GITHUB_STEP_SUMMARY"
