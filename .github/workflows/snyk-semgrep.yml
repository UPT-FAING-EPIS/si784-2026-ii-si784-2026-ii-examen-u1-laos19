name: snyk-semgrep

# Escaneo de seguridad del código y de la imagen del contenedor. No necesita tokens:
#  - Semgrep (SAST) sobre el código fuente, workflows, Dockerfile y Terraform.
#  - Trivy: vulnerabilidades en dependencias (NuGet y npm), secretos expuestos,
#    configuraciones inseguras (Dockerfile/Terraform) y vulnerabilidades de la imagen del backend.
#  - Snyk (opcional): sólo se ejecuta si existe el secreto SNYK_TOKEN.
# Los reportes (SARIF, JSON, tabla y HTML) se publican como artefactos y en Security > Code scanning.
# Cada job falla si encuentra alguna vulnerabilidad.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Semgrep scan
        id: scan
        run: |
          mkdir -p reports
          set +e
          semgrep scan \
            --config p/default \
            --config p/csharp \
            --config p/react \
            --config p/javascript \
            --config p/dockerfile \
            --config p/terraform \
            --config p/github-actions \
            --config p/secrets \
            --metrics=off \
            --error \
            --sarif-output=reports/semgrep.sarif \
            --json-output=reports/semgrep.json \
            --text-output=reports/semgrep.txt \
            backend frontend infra .github
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Resumen Semgrep
        if: always()
        run: |
          total=$(python3 -c "import json;print(len(json.load(open('reports/semgrep.json'))['results']))" 2>/dev/null || echo "?")
          {
            echo "## Semgrep"
            echo ""
            echo "Hallazgos: **$total**"
            echo ""
            echo '```'
            head -c 60000 reports/semgrep.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        continue-on-error: true
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports-semgrep
          path: reports/

      - name: Verificar resultado
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::Semgrep encontró hallazgos de seguridad."
          exit 1

  trivy:
    name: Trivy (dependencias, secretos, IaC e imagen)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_VERSION: 0.75.0
      TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar Trivy (versión fijada y verificada)
        run: |
          curl -sSfLo /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum --check
          sudo mkdir -p /opt/trivy
          sudo tar -xzf /tmp/trivy.tgz -C /opt/trivy
          sudo ln -sf /opt/trivy/trivy /usr/local/bin/trivy
          trivy --version

      - name: Construir imagen del backend
        run: docker build -t musicstream-api:scan backend

      - name: Escanear repositorio (dependencias, secretos y configuración)
        id: fs
        run: |
          mkdir -p reports
          set +e
          trivy fs . --scanners vuln,secret,misconfig --skip-dirs docs \
            --format json --output reports/trivy-repo.json
          trivy convert --scanners vuln,secret,misconfig --format table --output reports/trivy-repo.txt reports/trivy-repo.json
          trivy convert --format sarif --output reports/trivy-repo.sarif reports/trivy-repo.json
          trivy convert --format template --template "@/opt/trivy/contrib/html.tpl" \
            --output reports/trivy-repo.html reports/trivy-repo.json 2>/dev/null
          trivy convert --exit-code 1 --format table reports/trivy-repo.json > /dev/null
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Escanear imagen del contenedor
        id: image
        run: |
          set +e
          trivy image musicstream-api:scan --scanners vuln,secret,misconfig \
            --format json --output reports/trivy-image.json
          trivy convert --scanners vuln,secret,misconfig --format table --output reports/trivy-image.txt reports/trivy-image.json
          trivy convert --format sarif --output reports/trivy-image.sarif reports/trivy-image.json
          trivy convert --exit-code 1 --format table reports/trivy-image.json > /dev/null
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Resumen
        if: always()
        env:
          FS_CODE: ${{ steps.fs.outputs.exit_code }}
          IMAGE_CODE: ${{ steps.image.outputs.exit_code }}
        run: |
          status() { if [ "$1" = "0" ]; then echo "✅ sin hallazgos"; else echo "❌ revisar reporte"; fi; }
          {
            echo "## Trivy"
            echo ""
            echo "| Escaneo | Resultado |"
            echo "|---|---|"
            echo "| Repositorio: dependencias NuGet/npm, secretos, Dockerfile y Terraform | $(status "$FS_CODE") |"
            echo "| Imagen de contenedor del backend | $(status "$IMAGE_CODE") |"
            echo ""
            echo '<details><summary>Detalle repositorio</summary>'
            echo ""
            echo '```'
            cat reports/trivy-repo.txt 2>/dev/null || true
            echo '```'
            echo '</details>'
            echo ""
            echo '<details><summary>Detalle imagen</summary>'
            echo ""
            echo '```'
            cat reports/trivy-image.txt 2>/dev/null || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar SARIF (repositorio)
        if: always() && hashFiles('reports/trivy-repo.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        continue-on-error: true
        with:
          sarif_file: reports/trivy-repo.sarif
          category: trivy-repo

      - name: Publicar SARIF (imagen)
        if: always() && hashFiles('reports/trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        continue-on-error: true
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-reports-trivy
          path: reports/

      - name: Verificar resultado
        env:
          FS_CODE: ${{ steps.fs.outputs.exit_code }}
          IMAGE_CODE: ${{ steps.image.outputs.exit_code }}
        run: |
          if [ "$FS_CODE" != "0" ] || [ "$IMAGE_CODE" != "0" ]; then
            echo "::error::Trivy encontró hallazgos de seguridad."
            exit 1
          fi

  snyk:
    name: Snyk (opcional, requiere SNYK_TOKEN)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Snyk no configurado
        if: env.SNYK_TOKEN == ''
        run: echo "::notice::Snyk omitido (sin secreto SNYK_TOKEN). El escaneo sin tokens lo realizan los jobs Semgrep y Trivy."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.SNYK_TOKEN != ''

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        if: env.SNYK_TOKEN != ''
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: env.SNYK_TOKEN != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Snyk CLI y snyk-to-html
        if: env.SNYK_TOKEN != ''
        run: npm install --global snyk snyk-to-html

      - name: Restaurar dependencias
        if: env.SNYK_TOKEN != ''
        run: |
          dotnet restore backend/MusicStream.sln
          (cd frontend && npm ci)

      - name: Construir imagen del backend
        if: env.SNYK_TOKEN != ''
        run: docker build -t musicstream-api:scan backend

      - name: Snyk Open Source - backend (.NET)
        if: env.SNYK_TOKEN != ''
        id: deps_backend
        run: |
          mkdir -p reports
          set +e
          snyk test --file=backend/MusicStream.sln --severity-threshold=low \
            --json-file-output=reports/snyk-backend-deps.json --sarif-file-output=reports/snyk-backend-deps.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Snyk Open Source - frontend (npm)
        if: env.SNYK_TOKEN != ''
        id: deps_frontend
        run: |
          set +e
          snyk test --file=frontend/package-lock.json --severity-threshold=low \
            --json-file-output=reports/snyk-frontend-deps.json --sarif-file-output=reports/snyk-frontend-deps.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Snyk Code (SAST)
        if: env.SNYK_TOKEN != ''
        id: code
        run: |
          set +e
          snyk code test backend frontend --severity-threshold=low \
            --json-file-output=reports/snyk-code.json --sarif-file-output=reports/snyk-code.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Snyk Container - imagen del backend
        if: env.SNYK_TOKEN != ''
        id: container
        run: |
          set +e
          snyk container test musicstream-api:scan --file=backend/Dockerfile --severity-threshold=low \
            --json-file-output=reports/snyk-container.json --sarif-file-output=reports/snyk-container.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generar reportes HTML
        if: env.SNYK_TOKEN != '' && (always())
        run: |
          for f in reports/snyk-*.json; do
            [ -s "$f" ] && snyk-to-html -i "$f" -o "${f%.json}.html" || true
          done
          {
            echo "## Snyk"
            echo ""
            echo "| Escaneo | Resultado |"
            echo "|---|---|"
            echo "| Dependencias backend (.NET) | ${{ steps.deps_backend.outputs.exit_code == '0' && '✅ sin vulnerabilidades' || '❌ revisar reporte' }} |"
            echo "| Dependencias frontend (npm) | ${{ steps.deps_frontend.outputs.exit_code == '0' && '✅ sin vulnerabilidades' || '❌ revisar reporte' }} |"
            echo "| Snyk Code (SAST) | ${{ steps.code.outputs.exit_code == '0' && '✅ sin vulnerabilidades' || '❌ revisar reporte' }} |"
            echo "| Imagen de contenedor | ${{ steps.container.outputs.exit_code == '0' && '✅ sin vulnerabilidades' || '❌ revisar reporte' }} |"
            echo ""
            echo "Los reportes HTML/JSON/SARIF están en el artefacto **security-reports-snyk**."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar SARIF (código)
        if: env.SNYK_TOKEN != '' && (always() && hashFiles('reports/snyk-code.sarif') != '')
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        continue-on-error: true
        with:
          sarif_file: reports/snyk-code.sarif
          category: snyk-code

      - name: Publicar SARIF (contenedor)
        if: env.SNYK_TOKEN != '' && (always() && hashFiles('reports/snyk-container.sarif') != '')
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        continue-on-error: true
        with:
          sarif_file: reports/snyk-container.sarif
          category: snyk-container

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.SNYK_TOKEN != '' && (always())
        with:
          name: security-reports-snyk
          path: reports/

      - name: Verificar resultado
        if: env.SNYK_TOKEN != ''
        env:
          DEPS_BACKEND: ${{ steps.deps_backend.outputs.exit_code }}
          DEPS_FRONTEND: ${{ steps.deps_frontend.outputs.exit_code }}
          CODE: ${{ steps.code.outputs.exit_code }}
          CONTAINER: ${{ steps.container.outputs.exit_code }}
        run: |
          status=0
          for pair in "backend:$DEPS_BACKEND" "frontend:$DEPS_FRONTEND" "code:$CODE" "container:$CONTAINER"; do
            name="${pair%%:*}"; code="${pair##*:}"
            if [ "$code" != "0" ]; then echo "::error::Snyk $name terminó con código $code"; status=1; fi
          done
          exit $status
